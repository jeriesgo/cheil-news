# Daily run of the news job.
# Needs: repository secret ANTHROPIC_API_KEY, and Settings > Pages > Source = "GitHub Actions".
# The feed is published at https://<user>.github.io/<repo>/news-feed.json
name: Daily news feed
on:
  schedule:
    - cron: "30 4 * * *"   # every day 04:30 UTC (05:30 Madrid in winter, 06:30 in summer)
  workflow_dispatch: {}    # "Run workflow" button for a manual run
permissions:
  contents: write   # pushes a copy of the feed to the "feed" branch (mirror for networks that block github.io)
  pages: write
  id-token: write
concurrency:
  group: news-feed
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev
      - run: node run.mjs --out out
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_PREVIOUS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/news-feed.json
      - name: Mirror the feed to the feed branch
        run: |
          mkdir -p mirror && cp out/news-feed.json mirror/
          cd mirror && git init -q -b feed && git add news-feed.json
          git -c user.name="cheil-news-bot" -c user.email="cheil-news-bot@users.noreply.github.com" commit -qm "Feed $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" feed
      - run: rm out/candidates.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
